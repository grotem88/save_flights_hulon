name: Automated Holon Flight Tracker

on:
  schedule:
    - cron: '0 * * * *' # מריץ את הסקריפט אוטומטית בכל שעה עגולה
  workflow_dispatch: # מאפשר לך להריץ ידנית מתי שבא לך

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    # השורות הבאות פותרות את האזהרה שקיבלת:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run Tracker Script
      run: python holon_tracker.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add flights_holon.csv
        git commit -m "Automated data update: $(date -u +'%Y-%m-%d %H:%M:%S') UTC" || exit 0
        git push
